version: '3'
services:
  wsgi:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data/backend/static/:/app/data/backend/static/
      - ./data/backend/logs/:/app/data/backend/logs/
    env_file:
      - .env
    environment:
      - LOG_FILE_NAME=wsgi
    command: ./entrypoint.sh
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - LOG_FILE_NAME=bot
    # Тот же образ, что у wsgi, только команда другая. Бот ходит в ту же БД
    # через ORM — ни второго репозитория, ни отдельного деплоя не нужно.
    command: python manage.py runbot
    restart: unless-stopped

  redis:
    image: "redis:alpine"
    ports:
      - "6379"
    restart: on-failure
    volumes:
      - redis_data:/data

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    command: celery -A cybernexvpn.celery.app worker --loglevel=info
    depends_on:
      - redis
    restart: on-failure
    volumes:
      - ./data/backend/static/:/app/data/backend/static/

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    # Файл расписания — во временную папку, а не в каталог проекта: там он
    # попадал в git и запекался в образ, ломая beat на другой платформе.
    command: celery -A cybernexvpn.celery.app beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    depends_on:
      - redis
    restart: on-failure
    volumes:
      - ./data/backend/static/:/app/data/backend/static/

volumes:
  redis_data:
